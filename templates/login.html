<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsroom Login — The Weekly Dispatch</title>
    <style>
        body {
            background: #0b0e14;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #131822;
            border: 1px solid #263042;
            border-top: 3px solid #00ffcc;
            border-radius: 10px;
            padding: 2.25rem;
            width: 100%;
            max-width: 400px;
        }
        h2 { margin: 0 0 0.4rem; }
        p { color: #8b949e; font-size: 0.9rem; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 0.35rem; }
        input {
            width: 100%;
            box-sizing: border-box;
            background: #0b0e14;
            border: 1px solid #263042;
            color: #e6edf3;
            padding: 0.7rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }
        input:focus { outline: none; border-color: #00ffcc; }
        button {
            width: 100%;
            background: #00ffcc;
            color: #0b0e14;
            border: none;
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .flash {
            background: rgba(255, 82, 82, 0.15);
            border: 1px solid #ff5252;
            color: #ff5252;
            padding: 0.65rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.25rem;
            color: #8b949e;
            text-decoration: none;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Newsroom Sign In</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" required autofocus>
            <label>Password</label>
            <input type="password" name="password" required>
            <button type="submit">Enter Newsroom</button>
        </form>
        <a href="/" class="back-link">← Back to Public Edition</a>
    </div>
</body>
</html>
